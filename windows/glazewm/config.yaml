# GlazeWM v3 — Windows tiling WM, replacing macos/aerospace/aerospace.toml
# Deploy target: ~/.glzr/glazewm/config.yaml
# Keybinds mirror AeroSpace: alt+hjkl focus, alt+shift+hjkl move, alt+1..9 workspaces.
# Docs: https://github.com/glzr-io/glazewm

general:
  # Show a cursor jump when focus moves to another monitor (≈ AeroSpace move-mouse).
  cursor_jump:
    enabled: true
    trigger: 'monitor_focus'
  focus_follows_cursor: false
  toggle_workspace_on_refocus: true
  # The status bar is Zebar (separate app). Uncomment to auto-start it:
  # startup_commands: ['shell-exec zebar']
  startup_commands: []
  shutdown_commands: []

gaps:
  scale_factor: 1.0
  inner_gap: '5px'
  outer_gap:
    top: '5px'
    right: '5px'
    bottom: '5px'
    left: '5px'

# Catppuccin Mocha focus borders.
window_effects:
  focused_window:
    border:
      enabled: true
      color: '#89b4fa'
  other_windows:
    border:
      enabled: true
      color: '#45475a'

window_behavior:
  initial_state: 'tiling'
  state_defaults:
    floating:
      centered: true
      shown_on_top: false
    fullscreen:
      maximized: false
      shown_on_top: false

# Workspaces 1-9 (AeroSpace parity). On a multi-monitor setup, pin 6-9 to the
# second monitor by adding `bind_to_monitor: 1` under those entries.
workspaces:
  - name: '1'
  - name: '2'
  - name: '3'
  - name: '4'
  - name: '5'
  - name: '6'
  - name: '7'
  - name: '8'
  - name: '9'

binding_modes:
  # Resize mode (≈ AeroSpace alt-minus/equal). Enter with alt+r, exit with esc/enter.
  - name: 'resize'
    keybindings:
      - commands: ['resize --width -2%']
        bindings: ['h', 'left']
      - commands: ['resize --width +2%']
        bindings: ['l', 'right']
      - commands: ['resize --height +2%']
        bindings: ['k', 'up']
      - commands: ['resize --height -2%']
        bindings: ['j', 'down']
      - commands: ['wm-disable-binding-mode --name resize']
        bindings: ['escape', 'enter']

keybindings:
  # ── Focus (alt + h/j/k/l) ──────────────────────────────────────────────
  - commands: ['focus --direction left']
    bindings: ['alt+h']
  - commands: ['focus --direction down']
    bindings: ['alt+j']
  - commands: ['focus --direction up']
    bindings: ['alt+k']
  - commands: ['focus --direction right']
    bindings: ['alt+l']

  # ── Move window (alt + shift + h/j/k/l) ────────────────────────────────
  - commands: ['move --direction left']
    bindings: ['alt+shift+h']
  - commands: ['move --direction down']
    bindings: ['alt+shift+j']
  - commands: ['move --direction up']
    bindings: ['alt+shift+k']
  - commands: ['move --direction right']
    bindings: ['alt+shift+l']

  # ── Layout / state ─────────────────────────────────────────────────────
  - commands: ['toggle-tiling-direction']
    bindings: ['alt+period']
  - commands: ['toggle-floating --centered']
    bindings: ['alt+shift+space']
  - commands: ['toggle-fullscreen']
    bindings: ['alt+f']
  - commands: ['toggle-minimized']
    bindings: ['alt+m']
  - commands: ['close']
    bindings: ['alt+shift+q']
  - commands: ['wm-enable-binding-mode --name resize']
    bindings: ['alt+r']

  # ── WM control (≈ AeroSpace service mode) ──────────────────────────────
  - commands: ['wm-reload-config']
    bindings: ['alt+shift+r']
  - commands: ['wm-exit']
    bindings: ['alt+shift+e']

  # ── Focus workspace (alt + 1..9) ───────────────────────────────────────
  - commands: ['focus --workspace 1']
    bindings: ['alt+1']
  - commands: ['focus --workspace 2']
    bindings: ['alt+2']
  - commands: ['focus --workspace 3']
    bindings: ['alt+3']
  - commands: ['focus --workspace 4']
    bindings: ['alt+4']
  - commands: ['focus --workspace 5']
    bindings: ['alt+5']
  - commands: ['focus --workspace 6']
    bindings: ['alt+6']
  - commands: ['focus --workspace 7']
    bindings: ['alt+7']
  - commands: ['focus --workspace 8']
    bindings: ['alt+8']
  - commands: ['focus --workspace 9']
    bindings: ['alt+9']

  # ── Move window to workspace (alt + shift + 1..9) ──────────────────────
  - commands: ['move --workspace 1']
    bindings: ['alt+shift+1']
  - commands: ['move --workspace 2']
    bindings: ['alt+shift+2']
  - commands: ['move --workspace 3']
    bindings: ['alt+shift+3']
  - commands: ['move --workspace 4']
    bindings: ['alt+shift+4']
  - commands: ['move --workspace 5']
    bindings: ['alt+shift+5']
  - commands: ['move --workspace 6']
    bindings: ['alt+shift+6']
  - commands: ['move --workspace 7']
    bindings: ['alt+shift+7']
  - commands: ['move --workspace 8']
    bindings: ['alt+shift+8']
  - commands: ['move --workspace 9']
    bindings: ['alt+shift+9']
