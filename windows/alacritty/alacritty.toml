# Alacritty — Windows variant of macos/alacritty.toml
# Differences from macOS: Catppuccin Mocha palette inlined (no ~/.config theme
# fetch), macOS-only keys removed (option_as_alt, blur), decorations = "Full",
# and the shell pinned to PowerShell 7.
# Deploy target: %APPDATA%\alacritty\alacritty.toml

[terminal.shell]
program = "pwsh"

[window]
padding = { x = 10, y = 25 }
dynamic_padding = true
decorations = "Full"
opacity = 0.7

[font]
normal = { family = "JetBrainsMono Nerd Font", style = "Regular" }
size = 13

[cursor]
style = { shape = "Beam", blinking = "On" }

# ── Catppuccin Mocha ────────────────────────────────────────────────────────
[colors.primary]
background = "#1e1e2e"
foreground = "#cdd6f4"
dim_foreground = "#7f849c"
bright_foreground = "#cdd6f4"

[colors.cursor]
text = "#1e1e2e"
cursor = "#f5e0dc"

[colors.vi_mode_cursor]
text = "#1e1e2e"
cursor = "#b4befe"

[colors.search.matches]
foreground = "#1e1e2e"
background = "#a6adc8"

[colors.search.focused_match]
foreground = "#1e1e2e"
background = "#a6e3a1"

[colors.footer_bar]
foreground = "#1e1e2e"
background = "#a6adc8"

[colors.hints.start]
foreground = "#1e1e2e"
background = "#f9e2af"

[colors.hints.end]
foreground = "#1e1e2e"
background = "#a6adc8"

[colors.selection]
text = "#1e1e2e"
background = "#f5e0dc"

[colors.normal]
black = "#45475a"
red = "#f38ba8"
green = "#a6e3a1"
yellow = "#f9e2af"
blue = "#89b4fa"
magenta = "#f5c2e7"
cyan = "#94e2d5"
white = "#bac2de"

[colors.bright]
black = "#585b70"
red = "#f38ba8"
green = "#a6e3a1"
yellow = "#f9e2af"
blue = "#89b4fa"
magenta = "#f5c2e7"
cyan = "#94e2d5"
white = "#a6adc8"
